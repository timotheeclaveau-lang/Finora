let ytBusy=false;
function yearTransition(y,after){
  if(ytBusy)return;
  if(y===S.year){after&&after();return}
  if(reduced){setYear(y,true);toast("Année "+y);after&&after();return}
  ytBusy=true;
  const ov=document.createElement("div");ov.className="yt";
  ov.innerHTML=`<div class="yt-in"><svg class="yt-logo" viewBox="80 120 380 250"><path class="yt-p" d="M408 168 280 308 205 245 102 348"/><circle class="yt-d" cx="408" cy="168" r="40"/></svg></div><div class="yt-y num">${y}</div><button class="skip" aria-label="Passer"></button>`;
  document.body.appendChild(ov);
  const yEl=ov.querySelector(".yt-y"),path=ov.querySelector(".yt-p"),dot=ov.querySelector(".yt-d"),logo=ov.querySelector(".yt-logo"),appEl=$("app");
  const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
  const A=(el,k,o)=>el.animate(k,Object.assign({fill:"both"},o));
  // 1. l'année apparaît
  A(ov,[{opacity:0},{opacity:1}],{duration:260,easing:"ease-out"});
  A(yEl,[{opacity:0,transform:"translate(-50%,-50%) scale(.82)",filter:"blur(10px)"},{opacity:1,transform:"translate(-50%,-50%) scale(1)",filter:"blur(0)"}],{duration:520,delay:120,easing:"cubic-bezier(.22,1,.36,1)"});
  // 2. elle se resserre dans le point du logo
  const r=dot.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=cx-innerWidth/2,dy=cy-innerHeight/2;
  setTimeout(()=>{
    A(yEl,[{opacity:1,transform:"translate(-50%,-50%) scale(1)"},{opacity:0,transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.08)`}],{duration:460,easing:"cubic-bezier(.55,0,.7,.2)"});
    A(dot,[{transform:"scale(0)"},{transform:"scale(1.35)",offset:.6},{transform:"scale(1)"}],{duration:480,delay:300,easing:"cubic-bezier(.34,1.56,.64,1)"});
  },900);
  // 3. on change d'année pendant que l'écran est couvert
  setTimeout(()=>{setYear(y,true)},1150);
  // 4. le logo se dessine à l'envers : il descend, remonte un peu, redescend
  setTimeout(()=>A(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:820,easing:"cubic-bezier(.65,0,.35,1)"}),1350);
  // 5. une fenêtre s'ouvre au bout du trait et l'appli réapparaît
  let revealed=false;
  const reveal=()=>{
    if(revealed)return;revealed=true;
    const lr=logo.getBoundingClientRect(),sx=lr.width/380,ex=lr.left+(102-80)*sx,ey=lr.top+(348-120)*sx;
    const far=Math.hypot(Math.max(ex,innerWidth-ex),Math.max(ey,innerHeight-ey));
    A(logo,[{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(1.25)"}],{duration:520,easing:"ease-in"});
    appEl.style.transformOrigin=ex+"px "+ey+"px";
    const t0=performance.now(),D=760;
    const step=now=>{
      const t=Math.min(1,(now-t0)/D),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      const R=far*1.05*e;
      const m=`radial-gradient(circle at ${ex}px ${ey}px, transparent ${R}px, #000 ${R+1}px)`;
      ov.style.webkitMaskImage=m;ov.style.maskImage=m;
      appEl.style.transform=`scale(${1.06-.06*e})`;
      if(t<1)requestAnimationFrame(step);
      else{ov.remove();appEl.style.transform="";appEl.style.transformOrigin="";ytBusy=false;after&&after()}
    };
    requestAnimationFrame(step);
  };
  const timer=setTimeout(reveal,2250);
  ov.querySelector(".skip").onclick=()=>{if(S.year!==y)setYear(y,true);clearTimeout(timer);reveal()};
}

// paiements = dépenses « Frais bancaires » marquées frais de compte, remboursements = rémunérations « Remboursement de frais de compte » du même montant
function feeData(id){
  const asc=(a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k;
  const ac=acc(id);const pays=S.ops.filter(o=>o.a===id&&isFee(o,ac)).sort(asc);
  const refs=S.ops.filter(o=>o.a===id&&o.t==="rem"&&o.c===FEE_REF).sort(asc);
  const used=new Set(),gap=(r,p)=>(pd(r.d)-pd(p.d))/864e5,same=(r,p)=>!used.has(r.id)&&Math.abs(r.m-p.m)<.005;
  // chaque frais est relié au remboursement du même montant arrivé autour de sa date (10 jours avant à 70 jours après)…
  const rows=pays.map(p=>{const r=refs.find(r=>same(r,p)&&gap(r,p)>=-10&&gap(r,p)<=70);if(r)used.add(r.id);return {p,r:r||null}});
  // …sinon à n'importe quel remboursement libre du même montant
  for(const x of rows){if(x.r)continue;const r=refs.find(r=>same(r,x.p));if(r){x.r=r;used.add(r.id)}}
  // un remboursement ne compte que s'il est du montant exact d'un frais (jamais un salaire ou une autre rentrée)
  const extra=refs.filter(r=>!used.has(r.id));
  // un frais sans remboursement est « pas remboursé » dès qu'il est entré
  const pend=ac&&ac.feeRefund===false?[]:rows.filter(x=>!x.r);
  return {rows,extra,pend,paid:pays.reduce((s,o)=>s+o.m,0),back:refs.reduce((s,o)=>s+o.m,0),due:pend.reduce((s,x)=>s+x.p.m,0)};
}
function feeCard(id){
  const a=acc(id);if(!a||!a.fees)return "";

    <span class="ic">${icon("receipt")}</span>
    <div class="fc-n">${esc(a.feeName||"Frais de compte")}<small>${a.feeRefund===false?`${f.rows.length} prélèvement${f.rows.length>1?"s":""} au total`:f.pend.length?`${f.pend.length} pas remboursé${f.pend.length>1?"s":""}`:`${eurTile(f.back)} remboursés`}</small></div>

}

// les fichiers (photos, PDF) sont rangés dans IndexedDB ; S.docs garde seulement la fiche de chaque facture
const IDB={p:null};
function idb(){if(!IDB.p)IDB.p=new Promise((res,rej)=>{const r=indexedDB.open("finora-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return IDB.p}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction("files",mode),st=t.objectStore("files");let out;const r=fn(st);if(r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)}))}
const fput=(id,v)=>idbDo("readwrite",st=>st.put(v,id));
const fget=id=>idbDo("readonly",st=>st.get(id));
const fdel=id=>idbDo("readwrite",st=>st.delete(id));
const fclear=()=>idbDo("readwrite",st=>st.clear());
const THUMBS=new Map();

const norm=s=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};i.src=u})}
function drawTo(img,max,q,asBlob){
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return asBlob?new Promise(r=>c.toBlob(r,"image/jpeg",q)):c.toDataURL("image/jpeg",q);
}
// les photos sont réduites (lisibles, légères), les PDF gardés tels quels
async function prepFile(file){
  if(file.size>30*1024*1024)throw new Error("Fichier trop lourd (30 Mo max)");
  if(/^image\//.test(file.type)||/\.(heic|jpe?g|png|webp)$/i.test(file.name)){
    const img=await loadImg(file);const blob=await drawTo(img,2000,.85,true);
    return {blob,thumb:drawTo(img,420,.72,false),type:"image/jpeg",size:blob.size};
  }
  if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)){
    let r=null;try{r=await withTimeout(pdfPages(file),45000)}catch(e){}
    return {blob:file,thumb:r&&r.thumb,pages:r&&r.pages,total:r&&r.total,type:"application/pdf",size:file.size};
  }
  throw new Error("Seules les photos et les PDF sont acceptés");
}

      const p=await prepFile(f);const id="d"+uid();await fput(id,{blob:p.blob,thumb:p.thumb,pages:p.pages||null,total:p.total||0});if(p.thumb)THUMBS.set(id,p.thumb);
      S.docs.push({id,opId:opId||null,name:f.name||"Facture",type:p.type,size:p.size,added:todayISO(),pv:p.thumb?1:0});added.push(id)}
    catch(e){toast(e&&e.message&&!/img/.test(e.message)?e.message:"Impossible de lire « "+(f.name||"ce fichier")+" »")}
  }
  if(added.length){save();renderAll();toast(added.length>1?added.length+" factures ajoutées":"Facture ajoutée")}
  return added;
}

async function pdfPages(blob,max=15){
  const L=await loadPdfJs();
  const pdf=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  const pages=[];let thumb=null;const n=Math.min(pdf.numPages,max);
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i),w0=pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:Math.min(2.4,1500/w0)});
    const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    pages.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.84)));
    if(i===1){const k=420/Math.max(c.width,c.height),t=document.createElement("canvas");t.width=Math.round(c.width*k);t.height=Math.round(c.height*k);t.getContext("2d").drawImage(c,0,0,t.width,t.height);thumb=t.toDataURL("image/jpeg",.72)}
  }
  return {pages,thumb,total:pdf.numPages};
}

  },{passive:false});
  sc.addEventListener("touchmove",e=>{if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches;setZ(pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)}},{passive:false});
  sc.addEventListener("touchend",e=>{if(e.touches.length<2)pinch=null});

  const close=()=>{el.classList.remove("open");setTimeout(()=>el.remove(),320)};

  for(let i=1;i<=Math.min(pdf.numPages,3);i++){
    const tc=await (await pdf.getPage(i)).getTextContent();const rows=new Map();
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/3);if(!rows.has(y))rows.set(y,[]);rows.get(y).push([it.transform[4],it.str])}

  }

}

  [/macbook|iphone|ipad|imac|airpods|apple watch|ordinateur|portable|disque dur|ssd|ecran|clavier|souris|chargeur|cable|usb|smartphone|tablette|console|casque audio|enceinte|samsung|xiaomi|pixel/,"High-tech"],
  [/abonnement|forfait mensuel/,"Abonnements"],[/pharmacie|medic|ordonnance/,"Santé & soins"],[/meuble|canape|lampe|deco|linge/,"Maison & déco"]];
function parseInvoice(raw){
  const text=String(raw||"").replace(/[|]/g," "),lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);

  const me=[S.profile.first,S.profile.last].filter(Boolean).map(norm);
  const AMT=/(\d{1,3}(?:[ .  ]\d{3})+|\d+)\s?[,.]\s?(\d{2})(?!\d)(?!\s?%)/g;
  const amountsIn=l=>{const r=[];let m;AMT.lastIndex=0;while((m=AMT.exec(l))){const v=parseFloat(m[1].replace(/[ .  ]/g,"")+"."+m[2]);if(v>0&&v<200000)r.push(v)}return r};
  const onlyNums=l=>!/[a-z]{3,}/i.test(l.replace(/eur|ttc|ht/gi,""))&&amountsIn(l).length>0;

  const prio=[/net a payer/,/net ttc/,/total (?:facture )?ttc/,/total paye/,/total (?:a payer|du|de la commande|commande)/,/montant (?:total )?ttc/,/montant (?:total|du|paye|regle|a regler)/,/a payer/,/^total(?: eur)?\b/,/\btotal\b(?! ht)(?! tva)(?! hors)(?! du produit)/];
  let amount=null;
  outer:for(const re of prio)for(let i=0;i<nlines.length;i++){

    if(/\b(tva|ht|hors taxe|remise|economie|eco-participation|livraison|port|sous-total)\b/.test(l)&&!/ttc|a payer|paye/.test(l))continue;
    if(/prix|qte|quantite|designation|description|unitaire/.test(l))continue;
    let a=amountsIn(lines[i].slice(m.index));
    for(let k=1;!a.length&&k<=2&&lines[i+k]&&onlyNums(lines[i+k]);k++)a=amountsIn(lines[i+k]);

  }

  // --- date
  const today=pd(todayISO()),cands=[];
  const ok=(y,m,d)=>{if(y<100)y+=2000;const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1||dt.getDate()!==d)return null;if(dt-today>3*864e5||today-dt>6*365*864e5)return null;return iso(dt)};
  nlines.forEach((l,i)=>{const w=(/date|facture|emise|emis le|commande|preleve|paye le|reglement|le \d/.test(l)?3:0)-(/periode|du .* au |echeance|valable|naissance|garantie|penalite/.test(l)?3:0);let m;
    const r1=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?!\d)/g;while((m=r1.exec(l))){const v=ok(+m[3],+m[2],+m[1]);if(v)cands.push([v,w,i])}
    const r2=/(\d{4})-(\d{2})-(\d{2})/g;while((m=r2.exec(l))){const v=ok(+m[1],+m[2],+m[3]);if(v)cands.push([v,w,i])}
    const r3=/(\d{1,2})(?:er)?\s+([a-z]{3,9})\.?\s+(\d{4})/g;while((m=r3.exec(l))){const k=Object.keys(MOIS).find(k=>m[2].startsWith(k));if(k){const v=ok(+m[3],MOIS[k],+m[1]);if(v)cands.push([v,w+1,i])}}});
  cands.sort((a,b)=>b[1]-a[1]||a[2]-b[2]);
  const date=cands.length?cands[0][0]:null;
  // --- article acheté : la ligne sous l'en-tête « Désignation / Description / Produit », sinon la ligne d'article la plus chère
  const cleanItem=s=>{let t=s.replace(AMT,"").replace(/\d+[.,]?\d*\s?%/g,"").replace(/\b(eur|euros?|ttc|ht|€)\b|€/gi,"").replace(/\s+/g," ").trim();
    t=t.replace(/^(\d{1,3}\s?x?\s+)(?=\D)/i,"");                                     // quantité en tête
    t=t.split(/\s+/).filter((w,i,a)=>!(i<2&&a.length>2&&/\d/.test(w)&&/[a-z]/i.test(w)&&w.length>=5&&w===w.toUpperCase())&&!(i===0&&/^\d{4,}$/.test(w))).join(" "); // références
    t=t.replace(/^[^A-Za-zÀ-ÿ0-9]+/,"").replace(/^(?:[a-zà-ÿ]{1,3}\s?[|;:,.]\s*)+/i,"").replace(/\s\d{7,}.*$/,"").replace(/\([^)]*\)/g,"");
    t=t.split(/\s*\/\s*| - | – |, | ; /)[0];
    t=t.trim().replace(/(\s+(\d{1,2}|[A-Z]{1,2}|x\d+|\d+x))+$/,"").trim();
    {const w=t.split(" ");const k=w.findIndex((x,i)=>i>=3&&/^\d+([.,]\d+)?(ghz|mhz)$/i.test(x));if(k>0)t=w.slice(0,k).join(" ");if(w.length>2&&/^[A-Z]{1,2}$/.test(w[0])&&/^[A-Z]/.test(w[1])&&!BRANDS.some(b=>b[0]===w[0].toLowerCase()))t=w.slice(1).join(" ")}                  // tailles, quantités en fin
    if(t===t.toUpperCase()&&/[A-Z]{3}/.test(t))t=t.toLowerCase().replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase());
    if(t.length>44)t=t.slice(0,44).replace(/\s+\S*$/,"");
    return t.replace(/[\s\-–:;,.]+$/,"");};
  const NOTITEM=/total|tva|sous-total|frais|\bport\b|livraison|manutention|remise|garantie|paiement|carte|rendu|monnaie|acompte|eco-?part|bonus|taux|montant|merci|reference client|commande|facture|client|adresse|page/;
  const isWordy=l=>(l.match(/[a-zA-Zà-ÿ]{3,}/g)||[]).length>=2;
  // --- marchand (jamais dans les lignes d'adresse de livraison / de ton nom)
  const shopLines=nlines.filter(l=>!/expedie|livraison|livre a|livrer|point relais|destinataire|facture a|factur[ée] a/.test(l)&&!me.some(x=>x&&(l.replace(/^[^a-z]+/,"").startsWith(x)||l.split(x).length>2)));
  const flat=" "+shopLines.join(" ")+" ";
  let brand=null,bpos=Infinity;for(const b of BRANDS){const m=new RegExp("[^a-z0-9]"+b[0].replace(/[+.]/g,"\\$&")+"[^a-z0-9]").exec(flat);if(m&&(m.index<bpos||m.index===bpos&&b[0].length>brand[0].length)){brand=b;bpos=m.index}}
  let item=null;
  const h=nlines.findIndex(l=>/designation|description|nom du produit|libelle|article|produit/.test(l)&&!/vendu|retour|reconditionn|commerciale|pieces/.test(l));
  const BOILER=/en cas|garantie|conformite|^nb\b|vous|votre|nos |www|http|@|tel\b|capital|rcs|siret|siren|penalit|escompte|retard|telecharg|disponibilite|merci|bientot|rib|bic|iban|dont |prime|condition/;
  const KNOWN=new RegExp(BRANDS.map(b=>b[0]).concat(["macbook","iphone","ipad","ssd","disque","casque","chaussure","lunette","pedale","compteur","velo","cadre","roue","pneu","scott","oakley","look","keo","wahoo","garmin","shimano","sram","manta","mips","sandisk"]).map(w=>w.replace(/[+.]/g,"\\$&")).join("|"));
  let best=null;
  lines.forEach((l,i)=>{const n=nlines[i];
    if(NOTITEM.test(n)||BOILER.test(n)||/\b\d{5} [a-z]{3,}\b/.test(n)&&!/\d[.,]\d{2}/.test(n)||me.some(x=>x&&n.startsWith(x)))return;
    const c=cleanItem(l);if(c.length<4||!/[a-zA-Zà-ÿ]{4,}/.test(c))return;
    let sc=0;const words=c.match(/[a-zA-Zà-ÿ]{3,}/g)||[];
    if(KNOWN.test(norm(c)))sc+=4;
    if(h>=0&&i>h&&i<=h+8)sc+=3-(i-h)*.2;
    if(amountsIn(l).length)sc+=1.5;if(/\d{7,}|[A-Z0-9]{8,}/.test(l))sc+=1;
    if(/[\[\]|{}<>=]/.test(l))sc-=1.5;
    if(i<3&&!amountsIn(l).length)sc-=3;
    if(/\b(rue|avenue|av|bd|boulevard|chemin|allee|place|route|zone|zi|za|impasse|quai|cedex|centre commercial)\b/.test(n))sc-=5;
    sc+=Math.min(2,words.filter(w=>/^[A-ZÀ-Ý]/.test(w)).length*.5);
    if(words.length<2&&!KNOWN.test(norm(c)))sc-=2;
    if(brand){const rest=norm(c).replace(new RegExp(brand[0].replace(/[+.]/g,"\\$&"),"g"),"").replace(/briancon|gap|paris|lyon|lille|grenoble|france|sas|sarl|magasin|centre|commercial/g,"").match(/[a-z]{3,}/g);if(!rest||rest.length<1)sc-=5}
    if(!best||sc>best.sc)best={c,sc}});
  if(best&&best.sc>=1.5)item=best.c;
  // combien d'articles ?
  const seenItems=new Set();
  lines.forEach((l,i)=>{const n=nlines[i];if(NOTITEM.test(n)||BOILER.test(n)||me.some(x=>x&&n.startsWith(x)))return;if(!amountsIn(l).length)return;
    const c=cleanItem(l);if(c.length<4||!/[a-zA-Zà-ÿ]{4,}/.test(c))return;
    if(/\d{6,}/.test(l)||/\b\d+\s?x\b|\bx\s?\d+\b|\bqt[ée]/i.test(l)||KNOWN.test(norm(c))||(h>=0&&i>h&&i<h+40))seenItems.add(norm(c))});
  const nItems=seenItems.size;
  // ville du magasin : juste après son nom, sinon le code postal le plus haut dans la facture
  let city=null;
  if(brand){const STOPW=/^(sas|sarl|sa|france|mme|m|mr|monsieur|madame|centre|commercial|magasin|direct|com|fr|www|store|shop|online|sur|et|de|du)$/i;
    for(let i=0;i<lines.length&&!city;i++){const n=nlines[i],k=n.indexOf(brand[0]);if(k<0||/expedie|livr|relais|facture a/.test(n))continue;
      const after=lines[i].slice(k+brand[0].length).replace(/^[\s\-–,.:#]+/,"").split(/\s+/);const w=after[0]||"";
      if(/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'\-]{2,}$/.test(w)&&!STOPW.test(w))city=w}

    if(city)city=city.toLowerCase().replace(/(^|[\s\-])\p{L}/gu,c=>c.toUpperCase())}

  if(ic)cat=ic[1];else if(brand)cat=brand[2];
  if(brand){const ops=S.ops.filter(o=>o.t==="dep"&&norm(o.l).includes(brand[0]));if(ops.length){const ac={},cc={};for(const o of ops){ac[o.a]=(ac[o.a]||0)+1;cc[o.c]=(cc[o.c]||0)+1}accId=Object.entries(ac).sort((a,b)=>b[1]-a[1])[0][0];if(!cat)cat=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0][0]}}

}
// opérations qui correspondent (même montant, date proche)
function findMatches(amount,date,name){
  if(!(amount>0))return [];
  const nw=name?norm(name).split(/[^a-z0-9]+/).filter(w=>w.length>=4):[];
  return S.ops.filter(o=>o.t!=="tri"&&o.t!=="tro"&&Math.abs(o.m-amount)<.015).map(o=>{
    let s=0;if(date){const dd=Math.abs(pd(o.d)-pd(date))/864e5;if(dd>25)return null;s+=12-Math.min(12,dd)}else{const age=(pd(todayISO())-pd(o.d))/864e5;if(age>120)return null;s+=4-age/40}
    if(nw.some(w=>norm(o.l).includes(w)))s+=8;if(hasDoc(o.id))s-=4;return {o,s}}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.o);
}
async function analyzeFile(file,tick){
  ocrTick=tick;
  try{
    const prep=await prepFile(file);
    let text="";
    if(prep.type==="application/pdf"){try{text=await pdfText(file)}catch(e){}
      if(text.replace(/\s/g,"").length<30&&prep.pages&&prep.pages[0]){tick&&tick("lecture",0);text=await withTimeout(ocrText(prep.pages[0]),90000)}}
    else{tick&&tick("lecture",0);text=await withTimeout(ocrText(prep.blob),90000)}
    return {prep,info:parseInvoice(text),text};
  }finally{ocrTick=null}
}
// enregistre un fichier déjà préparé
async function storeDoc(prep,name,opId,title){
  const id="d"+uid();await fput(id,{blob:prep.blob,thumb:prep.thumb,pages:prep.pages||null,total:prep.total||0});if(prep.thumb)THUMBS.set(id,prep.thumb);
  S.docs.push({id,opId:opId||null,name:name||"Facture",title:title||"",type:prep.type,size:prep.size,added:todayISO(),pv:prep.thumb?1:0});return id;
}
// importer : lire la facture, puis lier à l'opération trouvée ou en créer une
async function importInvoices(files){
  if(!files||!files.length)files=await chooseFiles();
  for(const f of files){
    let close,bar,lab;
    close=sheet(`<div class="scan"><div class="scan-ic">${icon("receipt")}</div><b>Lecture de la facture…</b><span id="scLab">${esc(f.name||"")}</span><div class="scan-bar"><i id="scBar"></i></div><p class="hint">La première fois, Finora télécharge l'outil de lecture (quelques secondes).</p></div>`,
      {mount:w=>{bar=w.querySelector("#scBar");lab=w.querySelector("#scLab")}});
    let res=null,fail=null;
    const t0=Date.now();
    try{res=await analyzeFile(f,(st,p)=>{if(!bar)return;bar.style.width=Math.round(8+(p||0)*92)+"%";lab.textContent=/recogniz|lecture/.test(st)?"Lecture du texte… "+Math.round((p||0)*100)+" %":"Préparation…"})}catch(e){fail=e}
    close();await new Promise(r=>setTimeout(r,Math.max(250,450-(Date.now()-t0))));
    if(!res){
      // lecture impossible (pas d'internet la 1re fois…) : on garde quand même la facture
      try{const prep=await prepFile(f);const id=await storeDoc(prep,f.name,null);save();renderAll();toast("Facture rangée, mais je n'ai pas pu la lire");await new Promise(r=>setTimeout(r,300));linkDoc(id)}catch(e){toast("Impossible de lire « "+(f.name||"ce fichier")+" »")}
      continue;
    }
    await reviewImport(f,res);
  }
}

async function importScreenshot(accId){

}

// frais de tenue de compte : on reconnaît les opérations au montant (et au libellé s'il est donné)
// retrouve dans les opérations du compte les frais qui reviennent (montant, nom, remboursés ou non)
function guessFee(id){
  if(!id)return null;const g={},FR=/frais|tenue|cotisation|\bp\.?\s?j\b|abonnement banc|commission|package|offre groupee/;
  for(const o of S.ops){if(o.a!==id||o.t!=="dep"||!(o.m>0&&o.m<60)||!(o.c===FEE_CAT||FR.test(norm(o.l))))continue;
    const k=o.m.toFixed(2),x=g[k]=g[k]||{m:o.m,n:0,d:"",l:{}};x.n++;if(o.d>x.d)x.d=o.d;x.l[o.l]=(x.l[o.l]||0)+1}
  const best=Object.values(g).filter(x=>x.n>=2).sort((a,b)=>a.d<b.d?1:-1)[0];if(!best)return null;
  const lab=Object.entries(best.l).sort((a,b)=>b[1]-a[1])[0][0].replace(/\bpaiment\b/i,"Paiement").trim();
  const refund=S.ops.some(o=>o.a===id&&o.t==="rem"&&Math.abs(o.m-best.m)<.005&&/rembours/.test(norm(o.l)));
  return {m:best.m,n:best.n,name:lab,refund};
}
function autoFeeTag(a){
  if(!a||!a.fees||!(a.feeAmt>0))return 0;let n=0;const key=a.feeLabel?norm(a.feeLabel):"",nm=a.feeName?norm(a.feeName):"";
  for(const o of S.ops){if(o.a!==a.id||Math.abs(o.m-a.feeAmt)>.005)continue;const l=norm(o.l);
    if(o.t==="dep"&&!o.fee&&(o.c===FEE_CAT||(nm&&l.includes(nm))||(key?l.includes(key):/frais|tenue|cotisation|\bp\.?\s?j\b|abonnement banc/.test(l)))){o.c=FEE_CAT;o.fee=1;n++}
    else if(o.t==="rem"&&o.c!==FEE_REF&&/rembours/.test(l)&&(!key||l.includes(key)||(nm&&l.includes(nm))||/frais|tenue/.test(l))){o.c=FEE_REF;n++}}
  return n;
}

// virements entre tes comptes : chaque envoi doit avoir sa réception (même montant, à quelques jours près)
function transferIssues(Y){
  const tr=S.ops.filter(o=>(o.t==="tro"||o.t==="tri")&&inYear(o,Y)&&acc(o.a));
  const used=new Set();
  for(const o of tr)if(o.g&&tr.some(x=>x.g===o.g&&x.id!==o.id))used.add(o.id);
  const outs=tr.filter(o=>o.t==="tro"&&!used.has(o.id)).sort((a,b)=>a.d<b.d?-1:1);
  for(const o of outs){let best=null,bd=99;
    // d'abord un autre compte ; sinon le même compte (coffre / poche d'épargne interne)
    for(const x of tr){if(x.t!=="tri"||used.has(x.id)||Math.abs(x.m-o.m)>.005)continue;const dd=Math.abs(pd(x.d)-pd(o.d))/864e5+(x.a===o.a?8:0);if(dd<=15&&dd<bd){best=x;bd=dd}}
    if(best){used.add(o.id);used.add(best.id)}}
  return tr.filter(o=>!used.has(o.id)).sort((a,b)=>a.d<b.d?1:-1);
}
function insights(){
  const Y=S.year,isCur=Y===curYear(),now=new Date(),lm=lastMonth(),out=[];

    if(f.pend.length){const ds=f.pend.map(x=>shortDate(x.p.d));
      add("todo","alert",`Attention : ${eurTile(f.due)} de frais non remboursés`,`${f.pend.length>1?`${f.pend.length} frais « ${a.feeName||"de compte"} » prélevés sur ${a.name} (${ds.slice(-4).join(", ")}${ds.length>4?"…":""}) n'ont pas été remboursés`:`Les frais « ${a.feeName||"de compte"} » prélevés sur ${a.name} le ${ds[0]} n'ont pas été remboursés`} par ta banque. Réclame-les, ou ajoute le remboursement s'il est arrivé.`,{l:"Voir les frais",fn:()=>openFees(a.id)})}}
  const tis=transferIssues(Y);
  tis.slice(0,4).forEach(o=>add("todo","swap",o.t==="tro"?`Virement envoyé sans réception`:`Virement reçu sans envoi`,
    o.t==="tro"?`${eurAbs(o.m)} envoyés depuis ${accName(o.a)} le ${shortDate(o.d)} : aucune réception de ce montant trouvée sur un autre de tes comptes. Ajoute-la si l'argent est arrivé chez toi.`
    :`${eurAbs(o.m)} reçus sur ${accName(o.a)} le ${shortDate(o.d)} : aucun envoi de ce montant trouvé depuis un autre de tes comptes. Ajoute-le s'il vient de chez toi.`,{l:"Voir l'opération",fn:()=>openOp(o.id)}));
  if(tis.length>4)add("todo","swap",`${tis.length-4} autre${tis.length>5?"s":""} virement${tis.length>5?"s":""} à vérifier`,`Regarde les transferts dans l'onglet Opérations.`,{l:"Voir les transferts",fn:()=>{opsFilter.type="tr";opsFilter.acc="all";go(PG.ops)}});
  const lb=S.lastBackup?Math.round((pd(todayISO())-pd(S.lastBackup))/864e5):null;
  if(S.ops.length&&(lb==null||lb>30))add("todo","down",lb==null?"Fais ta première sauvegarde":"Pense à refaire une sauvegarde",lb==null?"Tes données ne sont que sur ce téléphone : une sauvegarde te protège si tu le perds ou le changes.":`Ta dernière sauvegarde date de ${lb} jours.`,{l:"Sauvegarder",fn:backup});
  // --- attention
  for(const a of S.accounts){const b=balance(a.id);
    if(b<0)add("warn","alert",`${a.name} est à découvert`,`Solde : ${eur(b)}. Un transfert depuis un autre compte peut t'éviter des frais.`,{l:"Voir le compte",fn:()=>openAccountPage(a.id)});
    else if(a.kind!=="Épargne"&&b<50&&isCur)add("warn","wallet",`Solde bas sur ${a.name}`,`Il reste ${eur(b)} : attention aux prochains prélèvements.`,{l:"Voir le compte",fn:()=>openAccountPage(a.id)})}
  const cm=isCur?now.getMonth()+1:lm,cym=Y+"-"+pad2(cm),msC=monthStats(cym);
  if(msC.d>msC.g+.5&&msC.d>0)add("warn","out",`${capF(MONTHS[cm-1])} : tu dépenses plus que tu ne gagnes`,`${eurTile(msC.d)} dépensés pour ${eurTile(msC.g)} gagnés, soit ${eurTile(msC.d-msC.g)} de plus.`,{l:"Voir le mois",fn:()=>{ANA.month=cm;ANA.focus="d";go(PG.ana)}});
  // catégories : ce mois-ci comparé à ta moyenne des mois précédents
  const prev=[];for(let m=1;m<cm;m++)prev.push(Y+"-"+pad2(m));
  if(prev.length>=2){
    const avg={},cnt={},curC=sumBy(cym,depOf);
    for(const p of prev){const r=sumBy(p,depOf);for(const k in r){avg[k]=(avg[k]||0)+r[k]/prev.length;cnt[k]=(cnt[k]||0)+1}}
    const regular=k=>cnt[k]>=Math.ceil(prev.length/2); // on ignore les dépenses ponctuelles
    const ups=Object.keys(curC).filter(k=>regular(k)&&avg[k]>5&&curC[k]>avg[k]*1.4&&curC[k]-avg[k]>25).sort((a,b)=>(curC[b]-avg[b])-(curC[a]-avg[a])).slice(0,3);
    ups.forEach(k=>add("warn",catIcon(k),`${k} : en hausse`,`${eurTile(curC[k])} en ${MONTHS[cm-1]}, soit +${Math.round((curC[k]/avg[k]-1)*100)} % par rapport à ta moyenne (${eurTile(avg[k])}/mois). C'est un poste à surveiller.`,{l:"Voir le détail",fn:()=>{ANA.month=cm;openCat("dep",k,ANA)}}));
    // mois précédent terminé : ce qui a baissé
    if(cm>=3){const pm=Y+"-"+pad2(cm-1),pc=sumBy(pm,depOf),avg2={},cnt2={},pv=prev.slice(0,-1);
      for(const p of pv){const r=sumBy(p,depOf);for(const k in r){avg2[k]=(avg2[k]||0)+r[k]/pv.length;cnt2[k]=(cnt2[k]||0)+1}}
      Object.keys(avg2).filter(k=>cnt2[k]>=Math.ceil(pv.length/2)&&avg2[k]>30&&(pc[k]||0)<avg2[k]*.6).sort((a,b)=>(avg2[b]-(pc[b]||0))-(avg2[a]-(pc[a]||0))).slice(0,2)
        .forEach(k=>add("good",catIcon(k),`${k} : en baisse`,`${eurTile(pc[k]||0)} en ${MONTHS[cm-2]} contre ${eurTile(avg2[k])} en moyenne. Bien joué, continue comme ça.`))}
  }
  // placements (comptes de placements uniquement)
  const inv=S.accounts.filter(a=>a.invest);
  if(inv.length){let res=0;const byC={};for(const o of S.ops){if(!inYear(o,Y)||!inv.some(a=>a.id===o.a))continue;const v=o.t==="pli"?o.m:o.t==="plo"?-o.m:0;if(!v)continue;res+=v;const c=o.c||"Placement";byC[c]=(byC[c]||0)+v}
    if(res<-50)add("warn","trend","Tes placements sont en perte",`${eur(res)} depuis le 1er janvier sur ${inv.map(a=>a.name).join(", ")}.${Object.entries(byC).sort((a,b)=>a[1]-b[1])[0]?` Le plus gros écart : ${Object.entries(byC).sort((a,b)=>a[1]-b[1])[0][0]} (${eur(Object.entries(byC).sort((a,b)=>a[1]-b[1])[0][1])}).`:""} Fixe-toi une limite à ne pas dépasser.`,{l:"Voir les placements",fn:()=>{ANA.month=0;ANA.focus="p";go(PG.ana)}});
    else if(res>50)add("good","trend","Tes placements rapportent",`${eur(res,true)} depuis le 1er janvier.`,{l:"Voir les placements",fn:()=>{ANA.month=0;ANA.focus="p";go(PG.ana)}})}
  // l'année
  const ys=monthStats(String(Y));

    if(rate>=.1)add("good","coins",`Tu as gardé ${Math.round(rate*100)} % de ce que tu as gagné`,`${eurTile(ys.g-ys.d)} de plus gagnés que dépensés depuis janvier. Tu peux en placer une partie sur un livret d'épargne.`);
    else if(rate<0)add("warn","coins","Depuis janvier, tu dépenses plus que tu ne gagnes",`${eurTile(ys.d-ys.g)} d'écart. Repère dans l'Analyse les 2 ou 3 postes les plus lourds pour les réduire.`,{l:"Voir l'analyse",fn:()=>{ANA.month=0;ANA.focus="d";go(PG.ana)}})}

  if(totD>0&&(yc["Divers"]||0)/totD>.08)add("tip","dots","Beaucoup de « Divers »",`${eurTile(yc["Divers"])} sont rangés dans Divers : en les classant mieux, tes analyses seront plus justes.`);
  const fb=S.ops.filter(o=>inYear(o,Y)&&o.t==="dep"&&o.c===FEE_CAT&&!isFee(o,acc(o.a))).reduce((s,o)=>s+o.m,0);
  if(fb>15)add("tip","card","Frais bancaires",`${eurTile(fb)} de frais bancaires cette année (hors tenue de compte). Compare avec l'offre d'une autre banque si ça continue.`);
  return out;
}

/* ================= roue de date ================= */
function makeWheel(el,{n,label,loop,index,onChange}){
  const H=40,REP=loop?41:1,mid=loop?Math.floor(REP/2):0;
  el.innerHTML=`<div class="wl">${Array.from({length:n*REP},(_,k)=>`<div class="wi">${label(k%n)}</div>`).join("")}</div>`;
  const wl=el.firstChild,items=[...wl.children];let t=0,raf=0,last=index;
  const paint=()=>{raf=0;const c=wl.scrollTop/H;const a0=Math.max(0,Math.floor(c)-4),a1=Math.min(items.length-1,Math.ceil(c)+4);
    for(let k=a0;k<=a1;k++){const d=k-c,a=Math.min(1,Math.abs(d)/2.6);items[k].style.opacity=(1-a*.8).toFixed(3);items[k].style.transform=`perspective(500px) rotateX(${(-d*19).toFixed(1)}deg) scale(${(1-a*.1).toFixed(3)})`}};
  const settle=()=>{const k=Math.round(wl.scrollTop/H),i=((k%n)+n)%n;
    if(loop&&Math.abs(k-(mid*n+i))>n*4){wl.scrollTop=(mid*n+i)*H;paint()}
    if(i!==last){last=i;onChange(i)}};
  wl.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(paint);clearTimeout(t);t=setTimeout(settle,140)},{passive:true});
  wl.addEventListener("click",e=>{const it=e.target.closest(".wi");if(it)wl.scrollTo({top:items.indexOf(it)*H,behavior:"smooth"})});
  wl.scrollTop=(mid*n+index)*H;paint();
  return {n};
}
function openDatePicker(cur,onPick){
  let [y,m,d]=cur.split("-").map(Number);
  const dim=(y,m)=>new Date(y,m,0).getDate(),Y0=1900,Y1=2300;
  sheet(`<div class="sh-title">Date<button class="xbtn" data-close aria-label="Fermer">${icon("x")}</button></div>
    <div class="dp-prev" id="dpPrev"></div>
    <div class="wheels"><div class="wband"></div><div class="wheel" id="wD"></div><div class="wheel" id="wM"></div><div class="wheel" id="wY"></div></div>
    <button class="primary" id="dpOk">${icon("check")}Valider</button>`,
  {mount:(w,close)=>{
    const prev=()=>{w.querySelector("#dpPrev").textContent=capF(longDate(y+"-"+pad2(m)+"-"+pad2(d)))};
    let wd;
    const mkDay=()=>{const n=dim(y,m);if(d>n)d=n;wd=makeWheel(w.querySelector("#wD"),{n,label:i=>String(i+1),loop:true,index:d-1,onChange:i=>{d=i+1;prev()}})};
    const fix=()=>{if(wd.n!==dim(y,m))mkDay();prev()};
    mkDay();
    makeWheel(w.querySelector("#wM"),{n:12,label:i=>capF(MONTHS[i]),loop:true,index:m-1,onChange:i=>{m=i+1;fix()}});
    makeWheel(w.querySelector("#wY"),{n:Y1-Y0+1,label:i=>String(Y0+i),loop:false,index:Math.min(Y1,Math.max(Y0,y))-Y0,onChange:i=>{y=Y0+i;fix()}});
    prev();
    w.querySelector("#dpOk").onclick=()=>{close();onPick(y+"-"+pad2(m)+"-"+pad2(d))};
  }});
}

let F;
function resetForm(over={}){
  const prev=F||{};
  F=Object.assign({mode:"new",ids:[],kind:prev.kind&&prev.mode==="new"?prev.kind:"dep",dir:"out",acc:prev.acc&&prev.mode==="new"&&acc(prev.acc)?prev.acc:S.accounts[0]&&S.accounts[0].id,to:null,cat:"",sub:"",amount:"",label:"",date:defDate(),note:"",linked:true,files:[]},over);
  if(F.kind==="tr"&&!F.to)F.to=(S.accounts.find(a=>a.id!==F.acc)||{}).id;
  renderForm();
}
function editOp(id,dup){
  const o=S.ops.find(x=>x.id===id);if(!o)return;
  const kind=KIND_OF[o.t],p=partnerOf(o);
  const f={sub:o.s||"",fee:o.fee?1:0,mode:dup?"new":"edit",ids:dup?[]:[o.id].concat(p?[p.id]:[]),kind,dir:(o.t==="tri"||o.t==="pli")?"in":"out",acc:o.a,to:null,cat:o.c,amount:String(o.m).replace(".",","),label:o.l,date:dup?todayISO():o.d,note:o.n,linked:!!p};
  if(kind==="tr"){
    if(p){const out=o.t==="tro"?o:p,inn=o.t==="tro"?p:o;f.acc=out.a;f.to=inn.a;f.dir="out"}
    else if(dup){f.linked=true;if(o.t==="tri"){f.to=o.a;f.acc=(S.accounts.find(a=>a.id!==o.a)||{}).id}else f.to=(S.accounts.find(a=>a.id!==o.a)||{}).id}
    else f.linked=false;
  }
  if(curPush)curPush.close();F=null;resetForm(f);go(PG.add);
}

const opsOfCat=(name,type)=>S.ops.filter(o=>o.c===name&&typeOfOp(o)===type);

function editCat(name,type,done){
  const c=name?catOf(name,type):null,lock=!!c&&CAT_LOCK.has(c.name);
  let ic=c?catIcon(c.name):"tag",subs=c?(c.subs||[]).slice():[];
  const nOf=x=>c?S.ops.filter(o=>o.c===c.name&&typeOfOp(o)===type&&o.s===x).length:0;
  sheet(`<div class="sh-title">${c?esc(c.name):"Nouvelle catégorie"}<button class="xbtn" data-close aria-label="Fermer">${icon("x")}</button></div>
    <div class="group"><label class="cell">${icon("text")}<span class="ck">Nom</span><input id="ceName" value="${c?esc(c.name):""}" placeholder="Ex : Animaux" autocomplete="off" enterkeyhint="done" ${lock?"disabled":""}></label>
      <div class="cell">${icon("list")}<span class="ck">Type</span><span class="cv">${type}</span></div></div>
    ${lock?`<p class="hint" style="text-align:left;margin-top:8px">Finora a besoin de cette catégorie (frais de compte ou catégorie par défaut) : tu peux changer son icône et ses sous-catégories, mais pas la renommer ni la supprimer.</p>`:""}
    <div class="fl">Icône</div>
    <div class="icgrid" id="ceIc">${CAT_PICK_ICONS.map(i=>`<button type="button" data-i="${i}" class="${i===ic?"on":""}" aria-label="Icône ${i}">${icon(i)}</button>`).join("")}</div>
    <div class="fl">Sous-catégories</div>
    <div class="group" id="ceSubs"></div>
    <p class="hint" style="text-align:left;margin-top:8px">Ex : dans Courses → Leclerc, Boucherie, Marché. Tu les choisis quand tu ajoutes une opération, et l'analyse te montre combien part dans chacune.</p>
    <button class="primary" id="ceSave">${icon("check")}${c?"Enregistrer":"Créer la catégorie"}</button>
    ${c&&!lock?`<button class="ghost" id="ceDel" style="color:#ff453a">Supprimer cette catégorie</button>`:""}`,
  {mount:(w,close)=>{
    const box=w.querySelector("#ceSubs");
    const drawSubs=()=>{box.innerHTML=subs.map((x,i)=>`<div class="cell">${icon("dots")}<span class="ck cm-n">${esc(x)}${nOf(x)?`<small>${plural(nOf(x),"opération")}</small>`:""}</span><button type="button" class="subx" data-sd="${i}" aria-label="Supprimer ${esc(x)}">${icon("x")}</button></div>`).join("")
      +`<div class="cell">${icon("plus")}<input id="ceSubIn" placeholder="Ajouter une sous-catégorie" style="text-align:left" autocomplete="off" enterkeyhint="done"><button type="button" class="chip" id="ceSubAdd">Ajouter</button></div>`;
      const inp=box.querySelector("#ceSubIn");
      const add=()=>{const v=inp.value.trim();if(!v)return;if(subs.some(x=>norm(x)===norm(v))){toast("Cette sous-catégorie existe déjà");return}subs.push(v);drawSubs();box.querySelector("#ceSubIn").focus()};
      box.querySelector("#ceSubAdd").onclick=add;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}}};
    drawSubs();
    box.addEventListener("click",e=>{const d=e.target.closest("[data-sd]");if(d){subs.splice(+d.dataset.sd,1);drawSubs()}});
    w.querySelector("#ceIc").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;ic=b.dataset.i;w.querySelectorAll("#ceIc button").forEach(x=>x.classList.toggle("on",x===b))};
    w.querySelector("#ceSave").onclick=()=>{
      const nm=lock?c.name:w.querySelector("#ceName").value.trim().replace(/\s+/g," ");
      const left=box.querySelector("#ceSubIn").value.trim();if(left&&!subs.some(x=>norm(x)===norm(left)))subs.push(left);
      if(!nm){toast("Donne un nom à la catégorie");return}
      if(S.cats.some(x=>x!==c&&x.type===type&&norm(x.name)===norm(nm))){toast("Cette catégorie existe déjà");return}
      if(c){
        if(nm!==c.name){for(const o of S.ops)if(o.c===c.name&&typeOfOp(o)===type)o.c=nm;if(isBaseCat(c.name,type))S.catsGone=(S.catsGone||[]).concat(c.name);c.name=nm}
        // une sous-catégorie supprimée : ses opérations restent dans la catégorie
        for(const o of S.ops)if(o.c===nm&&typeOfOp(o)===type&&o.s&&!subs.includes(o.s))delete o.s;
        Object.assign(c,{icon:ic,subs})}
      else S.cats.push({name:nm,type,icon:ic,subs});
      save();close();renderAll();if(done)done();toast(c?"Catégorie enregistrée":`Catégorie « ${nm} » créée`)};
    const del=w.querySelector("#ceDel");if(del)del.onclick=async()=>{close();await new Promise(r=>setTimeout(r,320));deleteCat(c,type,done)};
  }});
}
async function deleteCat(c,type,done){
  const ops=opsOfCat(c.name,type);let to=null;
  if(ops.length){
    const others=S.cats.filter(x=>x.type===type&&x!==c&&!x.hidden);
    to=await pick(`Où ranger ses ${plural(ops.length,"opération")} ?`,others.map(x=>({label:x.name,value:x.name,icon:icon(catIcon(x.name))})));
    if(to==null)return;
  }else if(!await ask(`Supprimer « ${c.name} » ?`,"Elle ne te sera plus proposée. Tu pourras la remettre depuis Mes catégories.","Supprimer",true))return;
  for(const o of ops){o.c=to;delete o.s}
  if(isBaseCat(c.name,type))c.hidden=true;else S.cats.splice(S.cats.indexOf(c),1);
  save();renderAll();if(done)done();
  toast(ops.length?`« ${c.name} » supprimée · ${plural(ops.length,"opération")} dans ${to}`:`« ${c.name} » supprimée`);
}

  const type={dep:"Dépense",rem:"Rémunération",pl:"Placement"}[kind];

function saveForm(){
  readForm();const f=F,m=parseAmt(f.amount);
  if(!(m>0)){shake($("fAmt"));toast("Indique un montant");return}
  if(!f.acc){toast("Choisis un compte");return}

  if(f.kind==="tr"&&f.linked&&(!f.to||f.to===f.acc)){toast("Choisis le compte qui reçoit");return}
  const old=f.ids.map(id=>S.ops.find(o=>o.id===id)).filter(Boolean);

    const g=uid(),from=acc(f.acc),to=acc(f.to);
    S.ops.push(Object.assign({id:uid(),k:k0,a:f.acc,t:"tro",c:"",l:f.label.trim()||"Virement "+to.name,g},base));
    S.ops.push(Object.assign({id:uid(),k:k0,a:f.to,t:"tri",c:"",l:f.label.trim()||"Virement "+from.name,g},base));
    msg=`${eurAbs(m)} de ${from.name} vers ${to.name}`;
  }else{

    S.ops.push(Object.assign({id:uid(),k:k0,a:f.acc,t,c:f.kind==="tr"?"":f.cat,l:f.label.trim()},base,f.fee&&t==="dep"&&f.cat===FEE_CAT?{fee:1}:{},f.sub&&f.kind!=="tr"&&subsOf(f.cat,CAT_TYPE[f.kind]).includes(f.sub)?{s:f.sub}:{}));
    msg=`${accName(f.acc)} · nouveau solde ${eur(balance(f.acc))}`;
  }
  // les factures suivent l'opération (nouvel identifiant après modification)
  const newId=S.ops[S.ops.length-(f.kind==="tr"&&f.linked?2:1)].id;
  for(const d of S.docs)if(d.opId&&f.ids.includes(d.opId))d.opId=newId;
  const pending=f.files||[];if(pending.length)addDocs(pending,newId);
  const oy=+f.date.slice(0,4);if(!S.years.includes(oy)){S.years.push(oy);S.years.sort((a,b)=>a-b)}
  if(oy!==S.year)msg=`Enregistrée dans l'année ${oy}`;

  pages[PG.add].scrollTo({top:0,behavior:"smooth"});
  if(wasEdit)go(PG.ops);
}

function listOps(){

async function saveFile(name,text,mime){
  const blob=text instanceof Blob?text:new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
async function backup(){const files=(S.docs||[]).length?await docsForBackup():{};const okb=await saveFile("finora-sauvegarde-"+todayISO()+".json",JSON.stringify({app:"finora",version:2,date:new Date().toISOString(),data:S,files}),"application/json");if(okb){S.lastBackup=todayISO();save();updateRemindBadge();if($("remind").dataset.built)renderRemind();toast("Sauvegarde prête"+((S.docs||[]).length?" (avec tes factures)":""))}}
$("restoreFile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=async()=>{let o;try{o=JSON.parse(r.result)}catch(_){toast("Ce fichier n'est pas une sauvegarde Finora");return}
    if(!o||o.app!=="finora"||!o.data||!Array.isArray(o.data.ops)){toast("Ce fichier n'est pas une sauvegarde Finora");return}
    if(!await ask("Restaurer cette sauvegarde ?",`Sauvegarde du ${longDate(String(o.date).slice(0,10))} avec ${o.data.ops.length} opérations. Tout ce qu'il y a sur ce téléphone sera remplacé.`,"Restaurer",false))return;
    S=normalize(o.data);await restoreDocs(o.files);save();applyTheme();F=null;resetForm();renderAll();toast("Sauvegarde restaurée")};
  r.readAsText(f,"utf-8");
});
function exportCsv(){
  const q=s=>{s=String(s==null?"":s);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[["Date","Compte","Type","Catégorie","Sous-catégorie","Détails","Tarif","Note"]].concat(sortOps(S.ops.slice()).reverse().map(o=>{const[y,m,d]=o.d.split("-");return [d+"/"+m+"/"+y,accName(o.a),TYPES[o.t].l,o.c,o.s||"",o.l,String(o.m).replace(".",","),o.n]}));
  saveFile("finora-operations-"+todayISO()+".csv","﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n"),"text/csv").then(ok=>ok&&toast("Export prêt"));
}

/* ================= écran d'ouverture ================= */
function playSplash(force){
  return new Promise(done=>{
    const sp=$("splash"),inner=$("spInner"),path=$("spPath"),dot=$("spDot"),word=$("spWord"),appEl=$("app");
    // remise à zéro
    sp.hidden=false;sp.style.opacity="";sp.style.webkitMaskImage=sp.style.maskImage="";sp.style.pointerEvents="";
    inner.style.transform="";[inner,path,dot,word].forEach(el=>el.getAnimations&&el.getAnimations().forEach(x=>x.cancel()));
    word.innerHTML=[..."Finora"].map(c=>`<span>${c}</span>`).join("");
    const tag=$("spTag");tag.getAnimations&&tag.getAnimations().forEach(x=>x.cancel());
    const L=path.getTotalLength();
    path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
    dot.style.transform="scale(0)";
    document.documentElement.classList.add("booting");
    const anims=[];const A=(el,k,o)=>{const a=el.animate(k,Object.assign({fill:"forwards"},o));anims.push(a);return a};
    A(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:950,delay:250,easing:"cubic-bezier(.65,0,.35,1)"});
    A(dot,[{transform:"scale(0)"},{transform:"scale(1.35)",offset:.6},{transform:"scale(1)"}],{duration:520,delay:1130,easing:"cubic-bezier(.34,1.56,.64,1)"});
    [...word.children].forEach((s,i)=>A(s,[{opacity:0,transform:"translateX(-10px)",filter:"blur(8px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:520,delay:1350+i*85,easing:"cubic-bezier(.22,1,.36,1)"}));
    let skipped=false,zoomed=false;
    const zoom=()=>{
      if(zoomed)return;zoomed=true;
      anims.forEach(a=>a.finish&&a.finish());
      // centre du point
      const r=dot.getBoundingClientRect(),ir=inner.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
      inner.style.transformOrigin=(cx-ir.left)+"px "+(cy-ir.top)+"px";
      const far=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy));
      const Smax=far*1.2/rad;
      A(word,[{opacity:1},{opacity:0}],{duration:240,easing:"ease-out"});
      A($("spTag"),[{opacity:1},{opacity:0}],{duration:240,easing:"ease-out"});
      A(path,[{opacity:1},{opacity:0}],{duration:380,easing:"ease-in"});
      // le point grossit, puis une fenêtre s'ouvre dedans → on arrive dans l'appli
      document.documentElement.classList.remove("booting");
      appEl.style.transformOrigin=cx+"px "+cy+"px";
      const t0=performance.now(),D=1150;
      const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
      const step=now=>{
        const t=Math.min(1,(now-t0)/D);
        const sc=1+(Smax-1)*t*t*t;
        inner.style.transform=`scale(${sc})`;
        const R=rad*sc*ss((t-.28)/.55);
        const m=`radial-gradient(circle at ${cx}px ${cy}px, transparent ${R}px, #000 ${R+1}px)`;
        sp.style.webkitMaskImage=m;sp.style.maskImage=m;
        const k=ss((t-.3)/.7);appEl.style.transform=`scale(${1.14-.14*k})`;
        if(t<1)requestAnimationFrame(step);else{sp.hidden=true;sp.style.webkitMaskImage=sp.style.maskImage="";inner.style.transform="";appEl.style.transform="";appEl.style.transformOrigin="";done()}
      };
      appEl.style.transform="scale(1.14)";
      requestAnimationFrame(step);
    };
    A(tag,[{opacity:0,transform:"translateY(8px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:700,delay:2150,easing:"cubic-bezier(.22,1,.36,1)"});
    const timer=setTimeout(zoom,3500);
    $("spSkip").onclick=()=>{if(skipped)return;skipped=true;clearTimeout(timer);zoom()};
  });
}
